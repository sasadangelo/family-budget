<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family budget</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --other: #b4b2a9; --over: #e34948; --under: #2a78d6; --serious: #ec835a; --good: #0ca30c;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --other: #5c5b56; --over: #e66767; --under: #3987e5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0; font-weight: 600; }
.subtitle { color: var(--ink-2); margin: 4px 0 16px; }
.filters { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; color: var(--ink-2); }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.tile .delta { font-size: 13px; color: var(--ink-2); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.status { display: inline-flex; align-items: center; gap: 4px; }
.status svg { flex: none; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.card .tiles { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
.card .tile { padding: 8px 10px; border-radius: 8px; }
.card .tile .label { font-size: 12px; }
.card .tile .value { font-size: 17px; }
.card .tile .delta { font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 8px; padding: 0; list-style: none;
  color: var(--ink-2); font-size: 13px; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .hit { fill: transparent; cursor: default; outline: none; }
.chart .hit:hover, .chart .hit:focus-visible { fill: var(--ink); fill-opacity: 0.04; }
.note { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; }
details { margin-top: 8px; color: var(--ink-2); }
summary { cursor: pointer; font-size: 13px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; margin-top: 8px; font-size: 13px; color: var(--ink); }
th, td { padding: 4px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; }
.tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); min-width: 160px; }
.tooltip .title { color: var(--ink-2); margin-bottom: 4px; }
.tooltip .row { display: flex; align-items: center; gap: 8px; }
.tooltip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tooltip .row span { color: var(--ink-2); }
.key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; flex: none; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="filters"><label for="month" id="month-label"></label><select id="month"></select></div>
  <section class="tiles" id="kpis" aria-live="polite"></section>

  <div class="grid">
    <section class="card" id="cashflow"></section>
    <section class="card" id="categories"></section>
    <section class="card" id="recurring"></section>
    <section class="card" id="gap"></section>
  </div>
</main>
<div class="tooltip" id="tooltip" hidden></div>
<script type="application/json" id="data">/*__DATA__*/{}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const L = D.labels;
const LOCALE = D.language === "it" ? "it-IT" : "en-GB";
const MONTHS = L.months.split(",");
const money = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "EUR", useGrouping: "always" });
const money0 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "EUR", maximumFractionDigits: 0, useGrouping: "always" });
const pct = new Intl.NumberFormat(LOCALE, { style: "percent", maximumFractionDigits: 1, signDisplay: "exceptZero" });
const fmt = v => (v == null ? "–" : money.format(v));
const signed = v => (v == null ? "–" : (v > 0 ? "+" : "") + money.format(v));
const monthName = m => MONTHS[+m.slice(5) - 1] + " " + m.slice(0, 4);
const monthShort = m => MONTHS[+m.slice(5) - 1].slice(0, 3) + " " + m.slice(2, 4);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, text) {
  const node = tag.startsWith("svg:") ? document.createElementNS(SVGNS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

/* ---------- tooltip: values lead, labels follow; line keys ---------- */
const tip = document.getElementById("tooltip");
function showTip(event, title, rows) {
  tip.replaceChildren(el("div", { class: "title" }, title));
  for (const r of rows) {
    const row = el("div", { class: "row" });
    const key = el("i", { class: "key" });
    key.style.background = r.color;
    row.append(key, el("b", {}, r.value), el("span", {}, r.name));
    tip.append(row);
  }
  tip.hidden = false;
  const box = event.target.getBoundingClientRect ? event.target.getBoundingClientRect() : null;
  const x = event.clientX ?? (box ? box.left + box.width / 2 : 0);
  const y = event.clientY ?? (box ? box.top : 0);
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, x + 14), innerWidth - w - 8) + "px";
  tip.style.top = Math.min(Math.max(8, y - h - 12), innerHeight - h - 8) + "px";
}
const hideTip = () => { tip.hidden = true; };

/* ---------- legend & table ---------- */
function legend(items) {
  const ul = el("ul", { class: "legend" });
  for (const it of items) {
    const li = el("li");
    const mark = el("i", { class: it.line ? "key" : "swatch" });
    mark.style.background = it.color;
    li.append(mark, document.createTextNode(it.name));
    ul.append(li);
  }
  return ul;
}
function tableView(headers, rows) {
  const details = el("details");
  details.append(el("summary", {}, L.dash_table));
  const wrap = el("div", { class: "table-wrap" });
  const table = el("table");
  const tr = el("tr");
  headers.forEach(h => tr.append(el("th", { scope: "col" }, h)));
  const thead = el("thead");
  thead.append(tr);
  table.append(thead);
  const body = el("tbody");
  for (const r of rows) {
    const row = el("tr");
    r.forEach((c, i) => row.append(el(i ? "td" : "th", i ? {} : { scope: "row" }, c)));
    body.append(row);
  }
  table.append(body);
  wrap.append(table);
  details.append(wrap);
  return details;
}

/* ---------- axis helpers ---------- */
function niceTicks(min, max, count = 5) {
  if (min === max) { max = min + 1; }
  const span = max - min, raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => span / s <= count) || 10 * mag;
  const ticks = [];
  for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + 1e-9; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
/* bar with a 4px rounded data-end and a square baseline end */
function barPath(x, w, yBase, yEnd) {
  const h = Math.abs(yEnd - yBase), r = Math.min(4, h, w / 2);
  if (h < 0.5) return "";
  if (yEnd < yBase) {  // grows up: round the top
    return `M${x},${yBase}V${yEnd + r}Q${x},${yEnd} ${x + r},${yEnd}H${x + w - r}Q${x + w},${yEnd} ${x + w},${yEnd + r}V${yBase}Z`;
  }
  return `M${x},${yBase}V${yEnd - r}Q${x},${yEnd} ${x + r},${yEnd}H${x + w - r}Q${x + w},${yEnd} ${x + w},${yEnd - r}V${yBase}Z`;
}

/* ---------- generic column chart ----------
   opts: { bars: [{name, color, values}], stacked, line: {name, color, values}, colorOf(value, seriesIndex) } */
function columnChart(container, months, opts) {
  container.replaceChildren();
  const width = Math.max(280, container.clientWidth), height = opts.height || 200;
  const m = { top: 12, right: 12, bottom: 28, left: 64 };
  const iw = width - m.left - m.right, ih = height - m.top - m.bottom;
  const n = months.length, band = iw / Math.max(n, 1);
  let lo = 0, hi = 0;
  months.forEach((_, i) => {
    if (opts.stacked) {
      let pos = 0, neg = 0;
      opts.bars.forEach(s => { const v = s.values[i] || 0; if (v >= 0) pos += v; else neg += v; });
      hi = Math.max(hi, pos); lo = Math.min(lo, neg);
    } else {
      opts.bars.forEach(s => { const v = s.values[i] || 0; hi = Math.max(hi, v); lo = Math.min(lo, v); });
    }
    if (opts.line) { const v = opts.line.values[i] || 0; hi = Math.max(hi, v); lo = Math.min(lo, v); }
  });
  const ticks = niceTicks(lo, hi);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => m.top + ih - ((v - y0) / (y1 - y0)) * ih;
  const svg = el("svg:svg", { viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": opts.title });
  for (const t of ticks) {
    svg.append(el("svg:line", { x1: m.left, x2: width - m.right, y1: y(t), y2: y(t),
      stroke: t === 0 ? css("--axis") : css("--grid"), "stroke-width": 1 }));
    svg.append(el("svg:text", { x: m.left - 8, y: y(t) + 4, "text-anchor": "end" }, money0.format(t)));
  }
  months.forEach((month, i) => {
    const cx = m.left + band * i + band / 2;
    svg.append(el("svg:text", { x: cx, y: height - 8, "text-anchor": "middle" }, (opts.labelOf || monthShort)(month)));
    if (opts.stacked) {
      const w = Math.min(24, band * 0.5);
      let pos = 0;
      const visible = opts.bars.map((s, k) => [s, k]).filter(([s]) => (s.values[i] || 0) > 0);
      visible.forEach(([s], j) => {
        const v = s.values[i];
        const base = y(pos), end = y(pos + v);
        const isTop = j === visible.length - 1;
        const gap = j > 0 ? 2 : 0;  // 2px surface gap between segments
        const d = isTop ? barPath(cx - w / 2, w, base - gap, end) : `M${cx - w / 2},${end}H${cx + w / 2}V${base - gap}H${cx - w / 2}Z`;
        if (base - gap - end > 0.5) svg.append(el("svg:path", { d, fill: s.color }));
        pos += v;
      });
    } else {
      const k = opts.bars.length, w = Math.min(24, (band * 0.7) / k);
      const start = cx - (k * w + (k - 1) * 2) / 2;
      opts.bars.forEach((s, j) => {
        const v = s.values[i] || 0;
        const color = opts.colorOf ? opts.colorOf(v, j) : s.color;
        svg.append(el("svg:path", { d: barPath(start + j * (w + 2), w, y(0), y(v)), fill: color }));
      });
    }
  });
  if (opts.line) {  // the line breaks where a month has no data
    const pts = months.map((_, i) => opts.line.values[i] == null ? null : [m.left + band * i + band / 2, y(opts.line.values[i])]);
    let run = [];
    const flush = () => {
      if (run.length > 1) svg.append(el("svg:polyline", { points: run.map(p => p.join(",")).join(" "), fill: "none",
        stroke: opts.line.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      run = [];
    };
    pts.forEach(p => (p ? run.push(p) : flush()));
    flush();
    pts.filter(Boolean).forEach(([px, py]) => svg.append(el("svg:circle", { cx: px, cy: py, r: 4.5,
      fill: opts.line.color, stroke: css("--surface"), "stroke-width": 2 })));
  }
  months.forEach((month, i) => {  // one hit band per month: every series in one tooltip
    const hit = el("svg:rect", { class: "hit", x: m.left + band * i, y: m.top, width: band, height: ih, tabindex: 0,
      "aria-label": monthName(month) });
    const rows = () => opts.rows(i);
    const show = e => { const r = rows(); if (r.length) showTip(e, monthName(month), r); else hideTip(); };
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", () => show({ target: hit }));
    hit.addEventListener("pointerleave", hideTip);
    hit.addEventListener("blur", hideTip);
    svg.append(hit);
  });
  container.append(svg);
}

/* ---------- page: everything is scoped by the selected year ---------- */
const byMonth = Object.fromEntries(D.months.map(m => [m.month, m]));
const years = [...new Set(D.months.map(m => m.month.slice(0, 4)))].sort().reverse();
const palette = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7"];
const catColor = (name, i) => (name === L.dash_other ? css("--other") : css(palette[i % palette.length]));
const monthLabel = m => MONTHS[+m.slice(5) - 1].slice(0, 3);

document.title = L.dash_title;
document.getElementById("title").textContent = L.dash_title;
document.getElementById("subtitle").textContent = L.dash_subtitle;
document.getElementById("month-label").textContent = L.dash_year_label;
const select = document.getElementById("month");
years.forEach(y => select.append(el("option", { value: y }, y)));

const yearMonths = () => Array.from({ length: 12 }, (_, i) => `${select.value}-${String(i + 1).padStart(2, "0")}`);
const value = (m, key) => (byMonth[m] ? byMonth[m][key] : null);
const presentMonths = () => yearMonths().filter(m => byMonth[m]);
const total = key => presentMonths().reduce((acc, m) => acc + (byMonth[m][key] || 0), 0);

function tile(label, text, extra) {
  const t = el("div", { class: "tile" });
  t.append(el("div", { class: "label" }, label), el("div", { class: "value" }, text));
  if (extra) t.append(extra);
  return t;
}
function statusBadge(over, text) {
  const wrap = el("span", { class: "status" });
  const icon = el("svg:svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" });
  icon.append(el("svg:path", { d: over ? "M6 2L10 8H2Z" : "M6 10L2 4H10Z", fill: over ? css("--serious") : css("--good") }));
  wrap.append(icon, document.createTextNode(text));
  return wrap;
}
function chartIn(card) {
  const chart = el("div", { class: "chart" });
  card.append(chart);
  return chart;
}

function renderKpis() {
  document.getElementById("kpis").replaceChildren(
    tile(L.dash_year_income, fmt(total("income"))),
    tile(L.dash_year_expenses, fmt(total("expenses"))),
    tile(L.dash_year_balance, signed(total("balance"))),
    tile(L.dash_months_with_data, String(presentMonths().length)),
  );
}

function renderCashflow() {
  const ms = yearMonths();
  const card = document.getElementById("cashflow");
  card.replaceChildren(el("h2", {}, L.dash_cashflow));
  const s = [
    { name: L.dash_income, color: css("--s1"), values: ms.map(m => value(m, "income")) },
    { name: L.dash_expenses, color: css("--s2"), values: ms.map(m => value(m, "expenses")) },
  ];
  const line = { name: L.dash_balance, color: css("--s3"), values: ms.map(m => value(m, "balance")) };
  card.append(legend([...s, { ...line, line: true }]));
  columnChart(chartIn(card), ms, { title: L.dash_cashflow, bars: s, line, labelOf: monthLabel,
    rows: i => [...s, line].map(x => ({ name: x.name, color: x.color, value: x === line ? signed(x.values[i]) : fmt(x.values[i]) })) });
  card.append(tableView([L.dash_month, L.dash_income, L.dash_expenses, L.dash_balance],
    [...ms.map(m => [monthName(m), fmt(value(m, "income")), fmt(value(m, "expenses")), signed(value(m, "balance"))]),
     [L.dash_total, fmt(total("income")), fmt(total("expenses")), signed(total("balance"))]]));
}

function renderCategories() {
  const ms = yearMonths();
  const card = document.getElementById("categories");
  card.replaceChildren(el("h2", {}, L.dash_categories));
  const s = D.categories.map((c, i) => ({ name: c, color: catColor(c, i),
    values: ms.map(m => (byMonth[m] ? byMonth[m].by_category[c] || 0 : null)) }));
  card.append(legend(s));
  columnChart(chartIn(card), ms, { title: L.dash_categories, bars: s, stacked: true, labelOf: monthLabel,
    rows: i => (byMonth[ms[i]] ? s.filter(x => x.values[i] > 0).slice().reverse()
      .map(x => ({ name: x.name, color: x.color, value: fmt(x.values[i]) })) : []) });
  if (D.folded.length) card.append(el("p", { class: "note" }, L.dash_folded.replace("{names}", D.folded.join(", "))));
  // the table lists every category, also those folded into "Other" in the chart
  const present = presentMonths();
  const sumCat = c => present.reduce((acc, m) => acc + (byMonth[m].all_by_category[c] || 0), 0);
  card.append(tableView([L.dash_category, ...present.map(monthLabel), L.dash_total],
    [...D.all_categories.map(c => [c, ...present.map(m => fmt(byMonth[m].all_by_category[c] || 0)), fmt(sumCat(c))]),
     [L.dash_total, ...present.map(m => fmt(byMonth[m].expenses)), fmt(total("expenses"))]]));
}

function renderRecurring() {
  const ms = yearMonths();
  const card = document.getElementById("recurring");
  card.replaceChildren(el("h2", {}, L.dash_split));
  const tiles = el("div", { class: "tiles" });
  tiles.append(tile(L.dash_recurring, fmt(total("recurring"))), tile(L.dash_one_off, fmt(total("one_off"))));
  if (total("loans")) tiles.append(tile(L.dash_loans, fmt(total("loans"))));
  card.append(tiles);
  const split = [
    { name: L.dash_recurring, color: css("--s1"), values: ms.map(m => value(m, "recurring")) },
    { name: L.dash_one_off, color: css("--s2"), values: ms.map(m => value(m, "one_off")) },
    { name: L.dash_loans, color: css("--s3"), values: ms.map(m => value(m, "loans")) },
  ];
  card.append(legend(split));
  columnChart(chartIn(card), ms, { title: L.dash_split, bars: split, stacked: true, labelOf: monthLabel,
    rows: i => split.slice().reverse().map(x => ({ name: x.name, color: x.color, value: fmt(x.values[i]) })) });
  card.append(tableView([L.dash_month, L.dash_recurring, L.dash_one_off, L.dash_loans],
    [...presentMonths().map(m => [monthName(m), fmt(value(m, "recurring")), fmt(value(m, "one_off")), fmt(value(m, "loans"))]),
     [L.dash_total, fmt(total("recurring")), fmt(total("one_off")), fmt(total("loans"))]]));
}

function renderGap() {
  const ms = yearMonths();
  const card = document.getElementById("gap");
  card.replaceChildren(el("h2", {}, L.dash_widget));
  const compared = presentMonths().filter(m => byMonth[m].gap != null);
  if (!compared.length) {
    card.append(el("p", { class: "note" }, L.dash_no_benchmark));
    return;
  }
  const sum = key => compared.reduce((acc, m) => acc + byMonth[m][key], 0);
  const gapTotal = sum("gap"), over = gapTotal > 0;
  const delta = el("div", { class: "delta" });
  delta.append(statusBadge(over, `${pct.format(gapTotal / sum("benchmark"))} ${over ? L.dash_over : L.dash_under}`));
  const tiles = el("div", { class: "tiles" });
  tiles.append(tile(L.dash_benchmark, fmt(sum("benchmark"))), tile(L.dash_gap, signed(gapTotal), delta),
    tile(L.dash_gap_month, signed(gapTotal / compared.length)));
  card.append(tiles);
  card.append(legend([{ name: L.dash_over, color: css("--over") }, { name: L.dash_under, color: css("--under") }]));
  const gap = ms.map(m => value(m, "gap"));
  columnChart(chartIn(card), ms, { title: L.dash_gap_chart, bars: [{ name: L.dash_gap, color: css("--over"), values: gap }],
    labelOf: monthLabel, colorOf: v => (v > 0 ? css("--over") : css("--under")),
    rows: i => (gap[i] == null ? [] : [
      { name: L.dash_gap, color: gap[i] > 0 ? css("--over") : css("--under"), value: signed(gap[i]) },
      { name: L.dash_recurring, color: css("--s1"), value: fmt(value(ms[i], "recurring")) },
      { name: L.dash_benchmark, color: css("--muted"), value: fmt(value(ms[i], "benchmark")) }]) });
  card.append(tableView([L.dash_month, L.dash_recurring, L.dash_benchmark, L.dash_gap],
    [...compared.map(m => [monthName(m), fmt(value(m, "recurring")), fmt(value(m, "benchmark")), signed(value(m, "gap"))]),
     [L.dash_total, fmt(sum("recurring")), fmt(sum("benchmark")), signed(gapTotal)]]));
}

function renderAll() { renderKpis(); renderCashflow(); renderCategories(); renderRecurring(); renderGap(); }
select.addEventListener("change", renderAll);
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
renderAll();
</script>
</body>
</html>
