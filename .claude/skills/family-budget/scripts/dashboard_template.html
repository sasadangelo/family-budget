<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family budget</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --other: #b4b2a9; --over: #e34948; --under: #2a78d6; --serious: #ec835a; --good: #0ca30c;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --other: #5c5b56; --over: #e66767; --under: #3987e5;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0; font-weight: 600; }
.subtitle { color: var(--ink-2); margin: 4px 0 16px; }
.filters { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; color: var(--ink-2); }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.tile .delta { font-size: 13px; color: var(--ink-2); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.status { display: inline-flex; align-items: center; gap: 4px; }
.status svg { flex: none; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.card h3 + .tiles { margin-top: 6px; }
.card .tiles { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
.card .tile { padding: 8px 10px; border-radius: 8px; }
.card .tile .label { font-size: 12px; }
.card .tile .value { font-size: 17px; }
.card .tile .delta { font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 8px; padding: 0; list-style: none;
  color: var(--ink-2); font-size: 13px; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .hit { fill: transparent; cursor: default; outline: none; }
.chart .hit:hover, .chart .hit:focus-visible { fill: var(--ink); fill-opacity: 0.04; }
.note { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; }
details { margin-top: 8px; color: var(--ink-2); }
summary { cursor: pointer; font-size: 13px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; margin-top: 8px; font-size: 13px; color: var(--ink); }
th, td { padding: 4px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; }
.tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); min-width: 160px; }
.tooltip .title { color: var(--ink-2); margin-bottom: 4px; }
.tooltip .row { display: flex; align-items: center; gap: 8px; }
.tooltip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tooltip .row span { color: var(--ink-2); }
.key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; flex: none; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.chart .hit.link { cursor: pointer; }
.hint { color: var(--muted); font-size: 13px; margin: -8px 0 16px; }
.nav { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; font-size: 13px; }
.nav .spacer { flex: 1; }
a { color: var(--s1); text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.card-head h2 { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--page); }
.seg button { font: inherit; font-size: 13px; color: var(--ink-2); background: none; border: 0; border-radius: 6px;
  padding: 3px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.bars { display: grid; grid-template-columns: minmax(72px, min(36%, 240px)) minmax(0, 1fr) auto; gap: 6px 10px; align-items: center;
  font-size: 13px; }
.bars .name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { position: relative; height: 14px; }
.bars .fill { position: absolute; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 1px; }
.bars .fill.neg { border-radius: 4px 0 0 4px; }
.bars .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.bars .val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars .val span { color: var(--muted); margin-left: 6px; }
.stack { display: flex; gap: 2px; height: 18px; margin: 4px 0 8px; }
.stack i { display: block; height: 100%; min-width: 2px; }
.stack i:first-child { border-radius: 4px 0 0 4px; }
.stack i:last-child { border-radius: 0 4px 4px 0; }
.stack i:only-child { border-radius: 4px; }
h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 12px 0 0; }
td.wrap, th.wrap { white-space: normal; text-align: left; min-width: 140px; }
.card.wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<main>
  <nav class="nav" id="nav" hidden></nav>
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="filters" id="filters" hidden><label for="year" id="year-label"></label><select id="year"></select></div>
  <p class="hint" id="hint" hidden></p>
  <section class="tiles" id="kpis" aria-live="polite"></section>

  <div class="grid">
    <section class="card" id="cashflow"></section>
    <section class="card" id="categories"></section>
    <section class="card" id="recurring"></section>
    <section class="card" id="gap"></section>
  </div>
</main>
<div class="tooltip" id="tooltip" hidden></div>
<script type="application/json" id="data">/*__DATA__*/{}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const L = D.labels;
const LOCALE = D.language === "it" ? "it-IT" : "en-GB";
const MONTHS = L.months.split(",");
const money = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "EUR", useGrouping: "always" });
const money0 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "EUR", maximumFractionDigits: 0, useGrouping: "always" });
const pct = new Intl.NumberFormat(LOCALE, { style: "percent", maximumFractionDigits: 1, signDisplay: "exceptZero" });
const fmt = v => (v == null ? "–" : money.format(v));
const signed = v => (v == null ? "–" : (v > 0 ? "+" : "") + money.format(v));
const monthName = m => MONTHS[+m.slice(5) - 1] + " " + m.slice(0, 4);
const monthShort = m => MONTHS[+m.slice(5) - 1].slice(0, 3) + " " + m.slice(2, 4);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, text) {
  const node = tag.startsWith("svg:") ? document.createElementNS(SVGNS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

/* ---------- tooltip: values lead, labels follow; line keys ---------- */
const tip = document.getElementById("tooltip");
function showTip(event, title, rows) {
  tip.replaceChildren(el("div", { class: "title" }, title));
  for (const r of rows) {
    const row = el("div", { class: "row" });
    const key = el("i", { class: "key" });
    key.style.background = r.color;
    row.append(key, el("b", {}, r.value), el("span", {}, r.name));
    tip.append(row);
  }
  tip.hidden = false;
  const box = event.target.getBoundingClientRect ? event.target.getBoundingClientRect() : null;
  const x = event.clientX ?? (box ? box.left + box.width / 2 : 0);
  const y = event.clientY ?? (box ? box.top : 0);
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, x + 14), innerWidth - w - 8) + "px";
  tip.style.top = Math.min(Math.max(8, y - h - 12), innerHeight - h - 8) + "px";
}
const hideTip = () => { tip.hidden = true; };

/* ---------- legend & table ---------- */
function legend(items) {
  const ul = el("ul", { class: "legend" });
  for (const it of items) {
    const li = el("li");
    const mark = el("i", { class: it.line ? "key" : "swatch" });
    mark.style.background = it.color;
    li.append(mark, document.createTextNode(it.name));
    ul.append(li);
  }
  return ul;
}
function tableView(headers, rows) {
  const details = el("details");
  details.append(el("summary", {}, L.dash_table));
  const wrap = el("div", { class: "table-wrap" });
  const table = el("table");
  const tr = el("tr");
  headers.forEach(h => tr.append(el("th", { scope: "col" }, h)));
  const thead = el("thead");
  thead.append(tr);
  table.append(thead);
  const body = el("tbody");
  for (const r of rows) {
    const row = el("tr");
    r.forEach((c, i) => row.append(el(i ? "td" : "th", i ? {} : { scope: "row" }, c)));
    body.append(row);
  }
  table.append(body);
  wrap.append(table);
  details.append(wrap);
  return details;
}

/* ---------- axis helpers ---------- */
function niceTicks(min, max, count = 5) {
  if (min === max) { max = min + 1; }
  const span = max - min, raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => span / s <= count) || 10 * mag;
  const ticks = [];
  for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + 1e-9; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
/* bar with a 4px rounded data-end and a square baseline end */
function barPath(x, w, yBase, yEnd) {
  const h = Math.abs(yEnd - yBase), r = Math.min(4, h, w / 2);
  if (h < 0.5) return "";
  if (yEnd < yBase) {  // grows up: round the top
    return `M${x},${yBase}V${yEnd + r}Q${x},${yEnd} ${x + r},${yEnd}H${x + w - r}Q${x + w},${yEnd} ${x + w},${yEnd + r}V${yBase}Z`;
  }
  return `M${x},${yBase}V${yEnd - r}Q${x},${yEnd} ${x + r},${yEnd}H${x + w - r}Q${x + w},${yEnd} ${x + w},${yEnd - r}V${yBase}Z`;
}

/* ---------- generic column chart ----------
   opts: { bars: [{name, color, values}], stacked, line: {name, color, values}, colorOf(value, seriesIndex) } */
function columnChart(container, months, opts) {
  container.replaceChildren();
  const width = Math.max(280, container.clientWidth), height = opts.height || 200;
  const m = { top: 12, right: 12, bottom: 28, left: 64 };
  const iw = width - m.left - m.right, ih = height - m.top - m.bottom;
  const n = months.length, band = iw / Math.max(n, 1);
  let lo = 0, hi = 0;
  months.forEach((_, i) => {
    if (opts.stacked) {
      let pos = 0, neg = 0;
      opts.bars.forEach(s => { const v = s.values[i] || 0; if (v >= 0) pos += v; else neg += v; });
      hi = Math.max(hi, pos); lo = Math.min(lo, neg);
    } else {
      opts.bars.forEach(s => { const v = s.values[i] || 0; hi = Math.max(hi, v); lo = Math.min(lo, v); });
    }
    if (opts.line) { const v = opts.line.values[i] || 0; hi = Math.max(hi, v); lo = Math.min(lo, v); }
  });
  const ticks = niceTicks(lo, hi);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => m.top + ih - ((v - y0) / (y1 - y0)) * ih;
  const svg = el("svg:svg", { viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": opts.title });
  for (const t of ticks) {
    svg.append(el("svg:line", { x1: m.left, x2: width - m.right, y1: y(t), y2: y(t),
      stroke: t === 0 ? css("--axis") : css("--grid"), "stroke-width": 1 }));
    svg.append(el("svg:text", { x: m.left - 8, y: y(t) + 4, "text-anchor": "end" }, money0.format(t)));
  }
  months.forEach((month, i) => {
    const cx = m.left + band * i + band / 2;
    svg.append(el("svg:text", { x: cx, y: height - 8, "text-anchor": "middle" }, (opts.labelOf || monthShort)(month)));
    if (opts.stacked) {
      const w = Math.min(24, band * 0.5);
      let pos = 0;
      const visible = opts.bars.map((s, k) => [s, k]).filter(([s]) => (s.values[i] || 0) > 0);
      visible.forEach(([s], j) => {
        const v = s.values[i];
        const base = y(pos), end = y(pos + v);
        const isTop = j === visible.length - 1;
        const gap = j > 0 ? 2 : 0;  // 2px surface gap between segments
        const d = isTop ? barPath(cx - w / 2, w, base - gap, end) : `M${cx - w / 2},${end}H${cx + w / 2}V${base - gap}H${cx - w / 2}Z`;
        if (base - gap - end > 0.5) svg.append(el("svg:path", { d, fill: s.color }));
        pos += v;
      });
    } else {
      const k = opts.bars.length, w = Math.min(24, (band * 0.7) / k);
      const start = cx - (k * w + (k - 1) * 2) / 2;
      opts.bars.forEach((s, j) => {
        const v = s.values[i] || 0;
        const color = opts.colorOf ? opts.colorOf(v, j) : s.color;
        svg.append(el("svg:path", { d: barPath(start + j * (w + 2), w, y(0), y(v)), fill: color }));
      });
    }
  });
  if (opts.line) {  // the line breaks where a month has no data
    const pts = months.map((_, i) => opts.line.values[i] == null ? null : [m.left + band * i + band / 2, y(opts.line.values[i])]);
    let run = [];
    const flush = () => {
      if (run.length > 1) svg.append(el("svg:polyline", { points: run.map(p => p.join(",")).join(" "), fill: "none",
        stroke: opts.line.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      run = [];
    };
    pts.forEach(p => (p ? run.push(p) : flush()));
    flush();
    pts.filter(Boolean).forEach(([px, py]) => svg.append(el("svg:circle", { cx: px, cy: py, r: 4.5,
      fill: opts.line.color, stroke: css("--surface"), "stroke-width": 2 })));
  }
  months.forEach((month, i) => {  // one hit band per month: every series in one tooltip
    const link = opts.linkOf ? opts.linkOf(month) : null;
    const hit = el("svg:rect", { class: link ? "hit link" : "hit", x: m.left + band * i, y: m.top, width: band,
      height: ih, tabindex: 0, "aria-label": link ? L.dash_open_month.replace("{month}", monthName(month)) : monthName(month) });
    if (link) {
      hit.setAttribute("role", "link");
      hit.addEventListener("click", () => { location.href = link; });
      hit.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); location.href = link; } });
    }
    const rows = () => opts.rows(i);
    const show = e => { const r = rows(); if (r.length) showTip(e, monthName(month), r); else hideTip(); };
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", () => show({ target: hit }));
    hit.addEventListener("pointerleave", hideTip);
    hit.addEventListener("blur", hideTip);
    svg.append(hit);
  });
  container.append(svg);
}

/* ---------- shared page pieces ---------- */
const palette = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7"];
const catColor = (name, i) => (name === L.dash_other ? css("--other") : css(palette[i % palette.length]));
const monthLabel = m => MONTHS[+m.slice(5) - 1].slice(0, 3);
let side = "expenses";  // which side the category widgets show: "expenses" or "income"

function tile(label, text, extra) {
  const t = el("div", { class: "tile" });
  t.append(el("div", { class: "label" }, label), el("div", { class: "value" }, text));
  if (extra) t.append(extra);
  return t;
}
function statusBadge(over, text) {
  const wrap = el("span", { class: "status" });
  const icon = el("svg:svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" });
  icon.append(el("svg:path", { d: over ? "M6 2L10 8H2Z" : "M6 10L2 4H10Z", fill: over ? css("--serious") : css("--good") }));
  wrap.append(icon, document.createTextNode(text));
  return wrap;
}
function gapBadge(gap, benchmark) {
  const delta = el("div", { class: "delta" });
  delta.append(statusBadge(gap > 0, `${pct.format(gap / benchmark)} ${gap > 0 ? L.dash_over : L.dash_under}`));
  return delta;
}
function chartIn(card) {
  const chart = el("div", { class: "chart" });
  card.append(chart);
  return chart;
}
/* card title with the Expenses | Income switch; onChange re-renders the card */
function sideHeader(card, title, onChange) {
  const head = el("div", { class: "card-head" });
  const seg = el("div", { class: "seg", role: "group", "aria-label": title });
  for (const [key, label] of [["expenses", L.dash_expenses], ["income", L.dash_income]]) {
    const b = el("button", { type: "button", "aria-pressed": String(side === key) }, label);
    b.addEventListener("click", () => { if (side !== key) { side = key; onChange(); } });
    seg.append(b);
  }
  head.append(el("h2", {}, title), seg);
  card.append(head);
}
/* horizontal bars: one row per item; diverging when some values are negative */
function barList(items, opts = {}) {
  const box = el("div", { class: "bars" });
  const diverging = items.some(it => it.value < 0);
  const max = Math.max(1e-9, ...items.map(it => Math.abs(it.value)));
  for (const it of items) {
    const name = el("div", { class: "name", title: it.name }, it.name);
    const track = el("div", { class: "track" });
    if (diverging) track.append(el("i", { class: "mid" }));
    const fill = el("i", { class: "fill" + (diverging && it.value < 0 ? " neg" : "") });
    const share = (Math.abs(it.value) / max) * (diverging ? 50 : 100);
    fill.style.width = share + "%";
    fill.style.background = it.color;
    if (diverging) fill.style[it.value < 0 ? "right" : "left"] = "50%"; else fill.style.left = "0";
    track.append(fill);
    const val = el("div", { class: "val" }, it.text);
    if (it.note) val.append(el("span", {}, it.note));
    if (it.rows) {
      for (const node of [name, track, val]) {
        node.addEventListener("pointermove", e => showTip(e, it.name, it.rows));
        node.addEventListener("pointerleave", hideTip);
      }
    }
    box.append(name, track, val);
  }
  return box;
}
function stackBar(parts) {
  const total = parts.reduce((acc, p) => acc + Math.max(0, p.value || 0), 0);
  const bar = el("div", { class: "stack", role: "img", "aria-label": parts.map(p => `${p.name} ${fmt(p.value)}`).join(", ") });
  for (const p of parts) {
    if (!(p.value > 0)) continue;
    const seg = el("i");
    seg.style.flex = `${p.value / total} 1 0`;
    seg.style.background = p.color;
    seg.addEventListener("pointermove", e => showTip(e, p.name, [{ name: pct.format(p.value / total).replace("+", ""), color: p.color, value: fmt(p.value) }]));
    seg.addEventListener("pointerleave", hideTip);
    bar.append(seg);
  }
  return bar;
}
function setText(id, text) { document.getElementById(id).textContent = text; }
function show(id, text) { const node = document.getElementById(id); node.hidden = false; if (text != null) node.textContent = text; return node; }

/* ---------- year page: everything is scoped by the selected year ---------- */
function yearPage() {
  const byMonth = Object.fromEntries(D.months.map(m => [m.month, m]));
  const years = [...new Set(D.months.map(m => m.month.slice(0, 4)))].sort().reverse();
  document.title = L.dash_title;
  setText("title", L.dash_title);
  setText("subtitle", L.dash_subtitle);
  setText("year-label", L.dash_year_label);
  show("filters");
  show("hint", L.dash_click_hint);
  const select = document.getElementById("year");
  years.forEach(y => select.append(el("option", { value: y }, y)));
  const requested = new URLSearchParams(location.search).get("year") || location.hash.slice(1);
  if (years.includes(requested)) select.value = requested;

  const yearMonths = () => Array.from({ length: 12 }, (_, i) => `${select.value}-${String(i + 1).padStart(2, "0")}`);
  const value = (m, key) => (byMonth[m] ? byMonth[m][key] : null);
  const presentMonths = () => yearMonths().filter(m => byMonth[m]);
  const total = key => presentMonths().reduce((acc, m) => acc + (byMonth[m][key] || 0), 0);
  const linkOf = m => (byMonth[m] ? `${D.month_dir}/${m}.html` : null);

  function renderKpis() {
    document.getElementById("kpis").replaceChildren(
      tile(L.dash_year_income, fmt(total("income"))),
      tile(L.dash_year_expenses, fmt(total("expenses"))),
      tile(L.dash_year_balance, signed(total("balance"))),
      tile(L.dash_latest_month, presentMonths().length ? monthName(presentMonths().slice(-1)[0]) : "–"),
    );
  }

  function renderCashflow() {
    const ms = yearMonths();
    const card = document.getElementById("cashflow");
    card.replaceChildren(el("h2", {}, L.dash_cashflow));
    const s = [
      { name: L.dash_income, color: css("--s1"), values: ms.map(m => value(m, "income")) },
      { name: L.dash_expenses, color: css("--s2"), values: ms.map(m => value(m, "expenses")) },
    ];
    const line = { name: L.dash_balance, color: css("--s3"), values: ms.map(m => value(m, "balance")) };
    card.append(legend([...s, { ...line, line: true }]));
    columnChart(chartIn(card), ms, { title: L.dash_cashflow, bars: s, line, labelOf: monthLabel, linkOf,
      rows: i => [...s, line].map(x => ({ name: x.name, color: x.color, value: x === line ? signed(x.values[i]) : fmt(x.values[i]) })) });
    card.append(tableView([L.dash_month, L.dash_income, L.dash_expenses, L.dash_balance],
      [...ms.map(m => [monthName(m), fmt(value(m, "income")), fmt(value(m, "expenses")), signed(value(m, "balance"))]),
       [L.dash_total, fmt(total("income")), fmt(total("expenses")), signed(total("balance"))]]));
  }

  function renderCategories() {
    const ms = yearMonths();
    const income = side === "income";
    const names = income ? D.income_categories : D.categories;
    const folded = income ? D.income_folded : D.folded;
    const every = income ? D.all_income_categories : D.all_categories;
    const key = income ? "income_by_category" : "by_category";
    const card = document.getElementById("categories");
    card.replaceChildren();
    sideHeader(card, L.dash_categories, renderCategories);
    const s = names.map((c, i) => ({ name: c, color: catColor(c, i),
      values: ms.map(m => (byMonth[m] ? byMonth[m][key][c] || 0 : null)) }));
    card.append(legend(s));
    columnChart(chartIn(card), ms, { title: L.dash_categories, bars: s, stacked: true, labelOf: monthLabel, linkOf,
      rows: i => (byMonth[ms[i]] ? s.filter(x => x.values[i] > 0).slice().reverse()
        .map(x => ({ name: x.name, color: x.color, value: fmt(x.values[i]) })) : []) });
    if (folded.length) card.append(el("p", { class: "note" }, L.dash_folded.replace("{names}", folded.join(", "))));
    // the table lists every category, also those folded into "Other" in the chart
    const present = presentMonths();
    const all = "all_" + key;
    const sumCat = c => present.reduce((acc, m) => acc + (byMonth[m][all][c] || 0), 0);
    const totalKey = income ? "income" : "expenses";
    card.append(tableView([L.dash_category, ...present.map(monthLabel), L.dash_total],
      [...every.map(c => [c, ...present.map(m => fmt(byMonth[m][all][c] || 0)), fmt(sumCat(c))]),
       [L.dash_total, ...present.map(m => fmt(byMonth[m][totalKey])), fmt(total(totalKey))]]));
  }

  function renderRecurring() {
    const ms = yearMonths();
    const card = document.getElementById("recurring");
    card.replaceChildren(el("h2", {}, L.dash_split));
    const tiles = el("div", { class: "tiles" });
    tiles.append(tile(L.dash_recurring, fmt(total("recurring"))), tile(L.dash_one_off, fmt(total("one_off"))));
    if (total("loans")) tiles.append(tile(L.dash_loans, fmt(total("loans"))));
    card.append(tiles);
    const split = [
      { name: L.dash_recurring, color: css("--s1"), values: ms.map(m => value(m, "recurring")) },
      { name: L.dash_one_off, color: css("--s2"), values: ms.map(m => value(m, "one_off")) },
      { name: L.dash_loans, color: css("--s3"), values: ms.map(m => value(m, "loans")) },
    ];
    card.append(legend(split));
    columnChart(chartIn(card), ms, { title: L.dash_split, bars: split, stacked: true, labelOf: monthLabel, linkOf,
      rows: i => split.slice().reverse().map(x => ({ name: x.name, color: x.color, value: fmt(x.values[i]) })) });
    card.append(tableView([L.dash_month, L.dash_recurring, L.dash_one_off, L.dash_loans],
      [...presentMonths().map(m => [monthName(m), fmt(value(m, "recurring")), fmt(value(m, "one_off")), fmt(value(m, "loans"))]),
       [L.dash_total, fmt(total("recurring")), fmt(total("one_off")), fmt(total("loans"))]]));
  }

  function renderGap() {
    const ms = yearMonths();
    const card = document.getElementById("gap");
    card.replaceChildren(el("h2", {}, L.dash_widget));
    const compared = presentMonths().filter(m => byMonth[m].gap != null);
    if (!compared.length) {
      card.append(el("p", { class: "note" }, L.dash_no_benchmark));
      return;
    }
    const sum = key => compared.reduce((acc, m) => acc + byMonth[m][key], 0);
    const gapTotal = sum("gap");
    // the tiles describe the latest month with a comparison; the chart and the table cover the whole year
    const last = byMonth[compared[compared.length - 1]];
    card.append(el("h3", {}, `${L.dash_latest_month}: ${monthName(last.month)}`));
    const tiles = el("div", { class: "tiles" });
    tiles.append(tile(L.dash_recurring, fmt(last.recurring)), tile(L.dash_benchmark, fmt(last.benchmark)),
      tile(L.dash_gap, signed(last.gap), gapBadge(last.gap, last.benchmark)));
    card.append(tiles);
    card.append(legend([{ name: L.dash_over, color: css("--over") }, { name: L.dash_under, color: css("--under") }]));
    const gap = ms.map(m => value(m, "gap"));
    columnChart(chartIn(card), ms, { title: L.dash_gap_chart, bars: [{ name: L.dash_gap, color: css("--over"), values: gap }],
      labelOf: monthLabel, linkOf, colorOf: v => (v > 0 ? css("--over") : css("--under")),
      rows: i => (gap[i] == null ? [] : [
        { name: L.dash_gap, color: gap[i] > 0 ? css("--over") : css("--under"), value: signed(gap[i]) },
        { name: L.dash_recurring, color: css("--s1"), value: fmt(value(ms[i], "recurring")) },
        { name: L.dash_benchmark, color: css("--muted"), value: fmt(value(ms[i], "benchmark")) }]) });
    card.append(tableView([L.dash_month, L.dash_recurring, L.dash_benchmark, L.dash_gap],
      [...compared.map(m => [monthName(m), fmt(value(m, "recurring")), fmt(value(m, "benchmark")), signed(value(m, "gap"))]),
       [L.dash_total, fmt(sum("recurring")), fmt(sum("benchmark")), signed(gapTotal)]]));
  }

  select.addEventListener("change", () => { history.replaceState(null, "", "#" + select.value); renderAll(); });
  return function renderAll() { renderKpis(); renderCashflow(); renderCategories(); renderRecurring(); renderGap(); };
}

/* ---------- month page: one month of the ledger ---------- */
function monthPage() {
  const M = D.month;
  const year = M.month.slice(0, 4);
  document.title = `${L.dash_title} · ${monthName(M.month)}`;
  setText("title", `${L.dash_title} · ${monthName(M.month)}`);
  setText("subtitle", L.dash_month_subtitle);
  const nav = show("nav");
  nav.append(el("a", { href: `../dashboard.html#${year}` }, "← " + L.dash_back.replace("{year}", year)), el("span", { class: "spacer" }));
  if (D.previous) nav.append(el("a", { href: `${D.previous}.html` }, "‹ " + monthName(D.previous)));
  if (D.next) nav.append(el("a", { href: `${D.next}.html` }, monthName(D.next) + " ›"));

  function renderKpis() {
    const rate = M.income ? M.balance / M.income : null;
    document.getElementById("kpis").replaceChildren(
      tile(L.dash_month_income, fmt(M.income)),
      tile(L.dash_month_expenses, fmt(M.expenses)),
      tile(L.dash_month_balance, signed(M.balance)),
      tile(L.dash_savings_rate, rate == null ? "–" : pct.format(rate)),
    );
  }

  document.getElementById("cashflow").hidden = true;
  document.getElementById("categories").classList.add("wide");

  function renderCategories() {
    const income = side === "income";
    const items = income ? M.income_by_category : M.expenses_by_category;
    const total = income ? M.income : M.expenses;
    const card = document.getElementById("categories");
    card.replaceChildren();
    sideHeader(card, L.dash_categories, renderCategories);
    if (!items.length) { card.append(el("p", { class: "note" }, L.dash_no_data)); return; }
    // same colours as the year page: its coloured categories, everything else in the "Other" grey
    const named = income ? D.income_categories : D.categories;
    const colorOf = name => (named.includes(name) && name !== L.dash_other ? catColor(name, named.indexOf(name)) : css("--other"));
    const share = v => pct.format(v / total).replace("+", "");
    const levels = items.filter(it => named.includes(it.name)).map(it => ({ name: it.name, value: it.amount, color: colorOf(it.name) }));
    const rest = items.filter(it => !named.includes(it.name)).reduce((acc, it) => acc + it.amount, 0);
    if (rest > 0) levels.push({ name: L.dash_other, value: rest, color: css("--other") });
    card.append(legend(levels), stackBar(levels));
    card.append(barList(items.map(it => ({ name: it.name, value: it.amount, color: colorOf(it.name), text: fmt(it.amount), note: share(it.amount) }))));
    card.append(tableView([L.dash_category, L.dash_amount, L.dash_share],
      [...items.map(it => [it.name, fmt(it.amount), share(it.amount)]), [L.dash_total, fmt(total), ""]]));
  }

  function renderRecurring() {
    const card = document.getElementById("recurring");
    card.replaceChildren(el("h2", {}, L.dash_split));
    const tiles = el("div", { class: "tiles" });
    tiles.append(tile(L.dash_recurring, fmt(M.recurring)), tile(L.dash_one_off, fmt(M.one_off)));
    if (M.loans) tiles.append(tile(L.dash_loans, fmt(M.loans)));
    card.append(tiles);
    const parts = [
      { name: L.dash_recurring, color: css("--s1"), value: M.recurring },
      { name: L.dash_one_off, color: css("--s2"), value: M.one_off },
      { name: L.dash_loans, color: css("--s3"), value: M.loans },
    ];
    card.append(legend(parts), stackBar(parts));
    card.append(el("h3", {}, L.dash_one_off_list));
    if (!M.one_off_items.length) { card.append(el("p", { class: "note" }, L.dash_no_one_off)); return; }
    const wrap = el("div", { class: "table-wrap" });
    const table = el("table");
    const head = el("tr");
    [L.dash_date, L.dash_note, L.dash_description, L.dash_amount].forEach((h, i) =>
      head.append(el("th", { scope: "col", class: i === 1 || i === 2 ? "wrap" : "" }, h)));
    table.append(head);
    for (const o of M.one_off_items) {
      const row = el("tr");
      row.append(el("th", { scope: "row" }, new Date(o.date + "T00:00").toLocaleDateString(LOCALE, { day: "numeric", month: "short" })),
        el("td", { class: "wrap" }, o.note), el("td", { class: "wrap" }, o.description), el("td", {}, fmt(o.amount)));
      table.append(row);
    }
    wrap.append(table);
    card.append(wrap);
  }

  function renderGap() {
    const card = document.getElementById("gap");
    card.replaceChildren(el("h2", {}, L.dash_widget));
    if (M.gap == null) { card.append(el("p", { class: "note" }, L.dash_no_benchmark)); return; }
    const tiles = el("div", { class: "tiles" });
    tiles.append(tile(L.dash_recurring, fmt(M.recurring)), tile(L.dash_benchmark, fmt(M.benchmark)),
      tile(L.dash_gap, signed(M.gap), gapBadge(M.gap, M.benchmark)));
    card.append(tiles);
    card.append(el("h3", {}, L.dash_groups));
    card.append(legend([{ name: L.dash_over, color: css("--over") }, { name: L.dash_under, color: css("--under") }]));
    const explained = M.comparisons.reduce((acc, c) => acc + (c.spent - c.benchmark), 0);
    const rows = M.comparisons.map(c => ({ name: c.label, spent: c.spent, benchmark: c.benchmark, diff: c.spent - c.benchmark }));
    rows.push({ name: L.dash_not_compared, spent: null, benchmark: null, diff: M.gap - explained });
    card.append(barList(rows.map(r => {
      const color = css(r.diff > 0 ? "--over" : "--under");
      return { name: r.name, value: r.diff, color, text: signed(r.diff),
        note: r.benchmark ? pct.format(r.diff / r.benchmark) : "",
        rows: [{ name: L.dash_gap, color, value: signed(r.diff) },
          ...(r.spent == null ? [] : [{ name: L.dash_spent, color: css("--s1"), value: fmt(r.spent) },
            { name: L.dash_benchmark, color: css("--muted"), value: fmt(r.benchmark) }])] };
    })));
    card.append(tableView([L.dash_group, L.dash_spent, L.dash_benchmark, L.dash_gap],
      [...rows.map(r => [r.name, fmt(r.spent), fmt(r.benchmark), signed(r.diff)]),
       [L.dash_total, fmt(M.recurring), fmt(M.benchmark), signed(M.gap)]]));
  }

  return function renderAll() { renderKpis(); renderCategories(); renderRecurring(); renderGap(); };
}

const renderAll = D.page === "month" ? monthPage() : yearPage();
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
renderAll();
</script>
</body>
</html>
